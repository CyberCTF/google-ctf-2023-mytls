# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# myTLS (Google's 2023 security competition, by Google; a crypto challenge) as an Isoloom spec:
# a home-made mutual TLS server that keeps the flag for the admin; the player has a guest certificate.
# The challenge folder 2023/quals/crypto-mytls of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2023-mytls

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.186.0/24, internet: false}

machines:
  challenge:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    volumes: {ctf: /chroot/home/user}     # the flag, written by ctf/flag.sh at every start
    ports:
      challenge:
        port: 1337
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the server sends its certificate
    script: checks/probe.sh
    wait: 60

message: |
  myTLS (Google, 2023) answers at `nc localhost {{ machines.challenge.ports.challenge.published }}`.
  Read how the session key is derived: which private key does the server need to impersonate whom?
